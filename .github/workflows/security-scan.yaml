name: Security scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-scan:
    uses: wearetechnative/reusable_workflow_terraform/.github/workflows/security-scan.yml@v1
    # Remove block-on while the module still has findings to clear; the scan
    # then reports without failing. Put it back as soon as it is clean.
    with:
      block-on: HIGH,CRITICAL
